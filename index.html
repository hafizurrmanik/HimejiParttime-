<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arubaito">
<meta name="color-scheme" content="light dark">
<title>Himeji Arubaito Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Glass navigation bar: [back] [title] [language] -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <button class="glass-btn back-btn" id="backBtn" hidden aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-i="back"></span>
    </button>
    <span class="nav-title" id="navTitle">Arubaito</span>
    <button class="glass-btn lang-btn" id="langBtn" aria-label="Language"><span id="langLabel">EN</span></button>
  </div>
</header>

<main class="app" id="app">

  <!-- ============ HOME: categories ============ -->
  <section class="view active" id="view-home">
    <div class="large-title">
      <h1 data-i="title">Arubaito</h1>
      <p class="subtitle" data-i="subtitle"></p>
    </div>

    <div class="segmented" id="scopeSeg" role="tablist">
      <span class="seg-thumb"></span>
      <button class="seg active" data-scope="all" role="tab"></button>
      <button class="seg" data-scope="uomachi" role="tab"></button>
    </div>

    <div class="search glass">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" enterkeyhint="search">
      <button class="clear" id="clearQ" aria-label="Clear" hidden>×</button>
    </div>

    <h2 class="section-h" id="gridHead"></h2>
    <div class="grid" id="grid"></div>

    <!-- search results (cards) replace the grid while searching -->
    <div id="results" hidden>
      <h2 class="section-h" id="resultsHead"></h2>
      <ul class="shops" id="resultsList"></ul>
      <div class="empty" id="resultsEmpty" hidden></div>
    </div>
  </section>

  <!-- ============ CATEGORY PAGE: big shop cards ============ -->
  <section class="view" id="view-cat">
    <div class="cat-hero" id="catHero"></div>
    <div class="toolbar">
      <span class="count" id="catCount"></span>
      <div class="tools">
        <button class="pill" id="nearBtn"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.7-6.5-11a6.5 6.5 0 0113 0c0 5.3-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span data-i="near"></span></button>
        <button class="pill" id="sortBtn"></button>
      </div>
    </div>
    <ul class="shops" id="catList"></ul>
  </section>

  <!-- ============ SAVED ============ -->
  <section class="view" id="view-saved">
    <div class="large-title"><h1 data-i="tabSaved"></h1><p class="subtitle" data-i="savedSub"></p></div>
    <ul class="shops" id="savedList"></ul>
    <div class="empty" id="savedEmpty" hidden></div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="view" id="view-about">
    <div class="large-title"><h1 data-i="tabAbout"></h1></div>
    <div class="card glass-card" id="aboutCard"></div>
  </section>

</main>

<!-- Floating glass tab bar -->
<nav class="tabbar glass" id="tabbar">
  <span class="tab-thumb"></span>
  <button class="tab active" data-tab="home">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
    <span data-i="tabExplore"></span>
  </button>
  <button class="tab" data-tab="saved">
    <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.6a4.3 4.3 0 017.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg>
    <span data-i="tabSaved"></span><b class="badge" id="savedBadge" hidden>0</b>
  </button>
  <button class="tab" data-tab="about">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></svg>
    <span data-i="tabAbout"></span>
  </button>
</nav>

<!-- Detail sheet -->
<div class="backdrop" id="backdrop"></div>
<aside class="sheet glass-sheet" id="sheet" aria-hidden="true">
  <div class="grabber"></div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<div class="toast glass" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
